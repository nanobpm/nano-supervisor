[workspace]
# The root package plus the black-box contract-test suite (issues #3/#4/#5).
# Keeping them in one workspace means `cargo test --workspace` and the pinned
# toolchain / `Cargo.lock` cover both, and the Rust target of the suite resolves
# `target/debug/nano-supervisor` from the same build.
members = [".", "contract-tests"]

[package]
name = "nano-supervisor"
version = "0.0.1"
edition = "2021"
description = "Standalone Rust supervisor and job workers for Nano BPM coding agents"
license = "Apache-2.0"
repository = "https://github.com/nanobpm/nano-supervisor"
publish = false

[dependencies]
# 0.3.0 is the first release with job leases (`with_lease`, `job_lease_token`).
camunda-orchestration-sdk = { version = "0.3.1", default-features = false, features = ["rustls"] }
# Direct handle on the SDK's HTTP stack so `profile::client` can hand the SDK a
# tuned `reqwest::Client` (bounded idle-pool churn + TCP keep-alive — the
# connection-reuse half of nanobpm/nano-supervisor#23). Kept on the SDK's own
# reqwest version so `CamundaOptions::with_http_client` takes this client type.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Shell-style splitting for the `--agent` command string so an executable path
# or argument containing spaces can be preserved by quoting (src/main.rs).
shlex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Derive the supervisor control-socket path exactly like the Node plugin
# (`join(tmpdir(), "c8ctl-nano-sup-<sha1(home)[:8]>.sock")`) so `supervisor
# status` / `workforce status` can probe a running daemon. Already in the
# workspace lockfile via the contract-tests crate.
sha1 = "0.10"
# Shortest-round-trip f64 digit generation for the ECMAScript `Number::toString`
# used by the envelope normalizer (src/envelope.rs): serde_json renders a float
# with ryu's shortest digits but formats them the JSON way (trailing `.0`,
# exponential outside ~[1e-6, 1e21)), which diverges from the Node plugin's
# `String(number)`. ryu gives us the same shortest digits to reformat the
# ECMAScript way. Already serde_json's own transitive dep, so no new code is
# pulled in.
ryu = "1"
# (Cross-process serialization of `config.json` / workforce-manifest
# read-modify-write cycles uses an advisory `flock` on a temp-dir lock file in
# `fleet::StateLock`. An OS-released lock — the kernel drops it the instant a
# holder dies, so there is no abandoned marker to reclaim by guessing (an
# age-based reclaim could steal the lock from a merely-slow owner and break
# mutual exclusion) and the lock file never persists under the state home.)
fs2 = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "signal", "fs", "net"] }
# Parent-death cleanup: PR_SET_PDEATHSIG (Linux) and the kqueue watchdog (macOS).
# Also the `kill(pid, 0)` liveness probe for cross-process run-dir sweep safety (worker.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
