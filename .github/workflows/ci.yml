name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version and components; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace --all-targets --locked
      - name: release build
        run: cargo build --workspace --release --locked
      - name: binary smoke test
        run: ./target/release/nano-supervisor --help
      # rustls only: the Linux binary must not need the system OpenSSL (#11 ships
      # a self-contained binary). Regressed once via the SDK (orchestration-cluster-api-rust#50).
      - name: no OpenSSL linked
        if: runner.os == 'Linux'
        run: |
          ldd target/release/nano-supervisor
          if ldd target/release/nano-supervisor | grep -Ei 'libssl|libcrypto'; then
            echo "::error::nano-supervisor links OpenSSL; it must use rustls only"; exit 1
          fi
          if cargo tree --locked -i openssl >/dev/null 2>&1 || cargo tree --locked -i native-tls >/dev/null 2>&1; then
            echo "::error::openssl/native-tls is in the dependency tree"; cargo tree --locked -i openssl -i native-tls || true; exit 1
          fi

  # Contract tests against the Node plugin (issue #3). This is the target the
  # suite is written against, so it runs for real here (installs the pinned
  # `c8ctl-plugin-nano` 1.69.2) against a local engine started from the same
  # release's prebuilt server binary, so engine-backed worker cases run too;
  # live-supervisor cases still skip cleanly. The plain `test` job above also compiles this crate, but
  # skips its target cases there (the Node plugin is not installed on that runner).
  contract-tests-node:
    name: contract tests (Node target, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Issue #3 acceptance: the Node-target suite must pass on Linux AND macOS.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      NS_TARGET: node
      NANO_NO_UPDATE_NOTIFIER: "1"
      C8CTL_NANO_NO_LAUNCHD: "1"
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: install c8ctl CLI + pinned nano plugin
        run: |
          # Pin the host CLI: the snapshots record exact host output, so the
          # host contract must be reproducible.
          npm install -g @camunda8/cli@4.2.0
          # Keep the `name@version` form: `c8 load plugin` passes the package
          # straight to `npm install`, so this installs exactly 1.69.2. The
          # separate-args form (`c8 load plugin c8ctl-plugin-nano 1.69.2`)
          # silently drops the version and installs latest.
          c8 load plugin c8ctl-plugin-nano@1.69.2
          # Fail fast if the pinned plugin is not the one that loaded.
          c8 nano --help | head -1
          c8 nano --help | grep -q 'c8ctl-plugin-nano 1.69.2'
      - name: start local nano engine
        run: .github/scripts/start-nano-engine.sh 1.69.2 8080
      - name: contract tests (Node target)
        run: cargo test -p contract-tests --locked --no-fail-fast
        env:
          NS_ENGINE_URL: http://localhost:8080

  # Worker contract tests against the Rust `nano-supervisor work` (issue #4),
  # end to end on a real local engine. Only the worker_* files: the CLI surface
  # (`hire`, `workforce`, …) is Node-only until #3 lands for Rust.
  contract-tests-rust:
    name: contract tests (Rust target, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      NS_TARGET: rust
      NS_ENGINE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace --all-targets --locked
      - name: start local nano engine
        run: .github/scripts/start-nano-engine.sh 1.69.2 8080
      - name: worker contract tests (Rust target)
        run: |
          export NS_BIN="$PWD/target/debug/nano-supervisor"
          cargo test -p contract-tests --locked \
            --test worker_prompt --test worker_env --test worker_result \
            --test worker_lease --test worker_finalize --test worker_selection \
            --test worker_resume --test worker_sweeps -- --nocapture

  # Single required status for branch protection: add jobs above, not to the ruleset.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, test, contract-tests-node, contract-tests-rust]
    runs-on: ubuntu-latest
    steps:
      - name: all jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.contract-tests-node.result }}" = success
          test "${{ needs.contract-tests-rust.result }}" = success
