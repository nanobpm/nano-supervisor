name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version and components; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace --all-targets --locked
      - name: release build
        run: cargo build --workspace --release --locked
      - name: binary smoke test
        run: ./target/release/nano-supervisor --help
      # rustls only: the Linux binary must not need the system OpenSSL (#11 ships
      # a self-contained binary). Regressed once via the SDK (orchestration-cluster-api-rust#50).
      - name: no OpenSSL linked
        if: runner.os == 'Linux'
        run: |
          ldd target/release/nano-supervisor
          if ldd target/release/nano-supervisor | grep -Ei 'libssl|libcrypto'; then
            echo "::error::nano-supervisor links OpenSSL; it must use rustls only"; exit 1
          fi
          if cargo tree --locked -i openssl >/dev/null 2>&1 || cargo tree --locked -i native-tls >/dev/null 2>&1; then
            echo "::error::openssl/native-tls is in the dependency tree"; cargo tree --locked -i openssl -i native-tls || true; exit 1
          fi

  # Single required status for branch protection: add jobs above, not to the ruleset.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: all jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
