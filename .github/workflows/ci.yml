name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # The parity ledger guard resolves the issues its PARITY_GAPS rows cite (issue #59).
  issues: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version and components; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace --all-targets --locked
      - name: release build
        run: cargo build --workspace --release --locked
      - name: binary smoke test
        run: ./target/release/nano-supervisor --help
      # rustls only: the Linux binary must not need the system OpenSSL (#11 ships
      # a self-contained binary). Regressed once via the SDK (orchestration-cluster-api-rust#50).
      - name: no OpenSSL linked
        if: runner.os == 'Linux'
        run: |
          ldd target/release/nano-supervisor
          if ldd target/release/nano-supervisor | grep -Ei 'libssl|libcrypto'; then
            echo "::error::nano-supervisor links OpenSSL; it must use rustls only"; exit 1
          fi
          if cargo tree --locked -i openssl >/dev/null 2>&1 || cargo tree --locked -i native-tls >/dev/null 2>&1; then
            echo "::error::openssl/native-tls is in the dependency tree"; cargo tree --locked -i openssl -i native-tls || true; exit 1
          fi

  # Contract tests against the Node plugin (issue #3) — the reference the Rust
  # worker mirrors. Installs the pinned `c8ctl-plugin-nano` and starts the Nano
  # engine it ships (which issues `jobLeaseToken`), so the CLI,
  # state-file, socket-schema AND the engine-backed worker cases all run for
  # real. Live-supervisor cases still skip. The plain `test` job above also
  # compiles this crate, but skips its target cases there (no plugin installed).
  contract-tests-node:
    name: contract tests (Node target, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Issue #3 acceptance: the Node-target suite must pass on Linux AND macOS.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      NS_TARGET: node
      NS_ENGINE_URL: http://localhost:8080
      NANO_NO_UPDATE_NOTIFIER: "1"
      C8CTL_NANO_NO_LAUNCHD: "1"
      # No job-level GH_TOKEN: this job runs `npm install -g` and `c8 load plugin`
      # lifecycle scripts (and every worker/agent the suite spawns), so a job-wide
      # token would be exposed to all of them. The parity guard (issue #59) is the
      # only step that needs `gh`, so the token is scoped to that step alone — the
      # same least-privilege split contract-drift.yml uses.
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not persist the job token in the checkout: a compromised package
          # lifecycle script could otherwise recover it.
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: load reference versions
        # Single source of truth for the pinned fleet versions (issue #58).
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .github/reference-versions.env >> "$GITHUB_ENV"
      - name: install c8ctl CLI + pinned nano plugin
        run: |
          # Pin the host CLI: the snapshots record exact host output, so the
          # host contract must be reproducible.
          npm install -g "@camunda8/cli@${C8CTL_CLI_VERSION}"
          # Keep the `name@version` form: `c8 load plugin` passes the package
          # straight to `npm install`, so this installs exactly the pin. The
          # separate-args form (`c8 load plugin c8ctl-plugin-nano <ver>`)
          # silently drops the version and installs latest.
          c8 load plugin "c8ctl-plugin-nano@${PLUGIN_VERSION}"
          # Fail fast if the pinned plugin is not the one that loaded.
          c8 nano --help | head -1
          c8 nano --help | grep -q "c8ctl-plugin-nano ${PLUGIN_VERSION}"
      - name: start local nano engine
        run: .github/scripts/start-nano-engine.sh "$PLUGIN_VERSION" 8080
      - name: contract tests (Node target)
        env:
          # The parity guard (issue #59) calls `gh api` to assert each PARITY_GAPS
          # issue is still open; without a token `gh` cannot authenticate. Scoped
          # to THIS step only — not the npm/plugin lifecycle steps above.
          GH_TOKEN: ${{ github.token }}
        run: cargo test -p contract-tests --locked --no-fail-fast

  # Worker contract tests against the Rust `nano-supervisor work <hire>` (issue
  # #4), end to end on the same engine as the Node job — one suite, both targets. The fleet CLI surface (#3: hire, assign,
  # supervisor add/status, workforce list/add/status) runs as its own step via the cli/state/socket suites.
  contract-tests-rust:
    name: contract tests (Rust target, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      NS_TARGET: rust
      NS_ENGINE_URL: http://localhost:8080
      # No job-level GH_TOKEN: the suite spawns worker/agent processes, so a
      # job-wide token would leak into all of them. Only the parity guard (issue
      # #59) needs `gh`, so the token is scoped to that one step below (least
      # privilege, as in contract-drift.yml).
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not persist the job token in the checkout.
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace --all-targets --locked
      - name: load reference versions
        # Single source of truth for the pinned fleet versions (issue #58).
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .github/reference-versions.env >> "$GITHUB_ENV"
      - name: start local nano engine
        run: .github/scripts/start-nano-engine.sh "$PLUGIN_VERSION" 8080
      - name: worker contract tests (Rust target)
        env:
          # The parity guard (issue #59) calls `gh api` to assert each PARITY_GAPS
          # issue is still open. Scoped to THIS step (which runs `--test parity`)
          # only — not the whole job.
          GH_TOKEN: ${{ github.token }}
        run: |
          export NS_BIN="$PWD/target/debug/nano-supervisor"
          cargo test -p contract-tests --locked \
            --test worker_prompt --test worker_env --test worker_result \
            --test worker_lease --test worker_finalize --test worker_selection \
            --test worker_resume --test worker_sweeps --test pin --test nested_supervisor --test worker_offline --test pdeath_guard --test daemon_leak --test parity -- --nocapture
      - name: fleet CLI contract tests (Rust target)
        # live_status_round_trip stays skipped (needs NS_ALLOW_LIVE_SUPERVISOR=1): CI must not start a real daemon (#40).
        run: |
          export NS_BIN="$PWD/target/debug/nano-supervisor"
          cargo test -p contract-tests --locked --test cli --test state --test socket -- --nocapture

  # Single required status for branch protection: add jobs above, not to the ruleset.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, test, contract-tests-node, contract-tests-rust]
    runs-on: ubuntu-latest
    steps:
      - name: all jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.contract-tests-node.result }}" = success
          test "${{ needs.contract-tests-rust.result }}" = success
